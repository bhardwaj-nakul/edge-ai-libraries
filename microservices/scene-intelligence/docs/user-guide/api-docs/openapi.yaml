---
openapi: 3.1.0
info:
  title: Traffic Intelligence API
  description: Lightweight traffic analysis service for single intersection monitoring
  version: 1.0.0
paths:
  "/api/v1/traffic/current":
    get:
      summary: Get Current Traffic Intelligence
      description: |-
        Get current traffic intelligence data for the intersection.

        Returns complete traffic intelligence response matching data.json schema
        with weather data and VLM analysis.
      operationId: get_current_traffic_intelligence_api_v1_traffic_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Current Traffic Intelligence Api V1 Traffic Current
                  Get
  "/api/v1/weather/current":
    get:
      summary: Get Current Weather
      description: Get current weather data for the intersection location.
      operationId: get_current_weather_api_v1_weather_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Current Weather Api V1 Weather Current Get
  "/api/v1/analysis/trigger":
    post:
      summary: Trigger Analysis
      description: Manually trigger VLM traffic analysis.
      operationId: trigger_analysis_api_v1_analysis_trigger_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Trigger Analysis Api V1 Analysis Trigger Post
  "/api/v1/status":
    get:
      summary: Get Service Status
      description: Get service status and statistics.
      operationId: get_service_status_api_v1_status_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Service Status Api V1 Status Get
  "/api/v1/config":
    get:
      summary: Get Service Config
      description: Get service configuration (excluding sensitive data).
      operationId: get_service_config_api_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Get Service Config Api V1 Config Get
  "/api/v1/config/threshold":
    put:
      summary: Update Threshold
      description: Update high density threshold for traffic analysis.
      operationId: update_threshold_api_v1_config_threshold_put
      parameters:
      - name: threshold
        in: query
        required: true
        schema:
          type: integer
          maximum: 50
          minimum: 1
          description: New high density threshold
          title: Threshold
        description: New high density threshold
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                title: Response Update Threshold Api V1 Config Threshold Put
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/HTTPValidationError"
  "/health":
    get:
      summary: Health Check
      description: Health check endpoint.
      operationId: health_check_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
components:
  schemas:
    HTTPValidationError:
      properties:
        detail:
          items:
            "$ref": "#/components/schemas/ValidationError"
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
